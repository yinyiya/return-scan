<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root { --c:#2f6b4f; --c2:#e8f2ec; --bad:#c0392b; --warn:#d68910; --bg:#f4f5f3; --line:#dcdfd9; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
         background:var(--bg); color:#222; font-size:16px; }
  header { position:sticky; top:0; z-index:5; background:var(--c); color:#fff; padding:12px 16px;
           display:flex; justify-content:space-between; align-items:center; }
  header b { font-size:18px; }
  header button { background:rgba(255,255,255,.18); color:#fff; border:0; border-radius:16px; padding:6px 12px; font-size:14px; }
  main { padding:16px; max-width:560px; margin:0 auto; }
  .card { background:#fff; border-radius:14px; padding:16px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  h2 { font-size:17px; margin:0 0 12px; }
  label { display:block; font-size:14px; color:#555; margin:14px 0 6px; }
  input, textarea, select { width:100%; font-size:17px; padding:12px; border:1px solid var(--line); border-radius:10px; background:#fff; }
  textarea { min-height:80px; resize:vertical; }
  .btn { display:block; width:100%; border:0; border-radius:12px; padding:15px; font-size:17px; font-weight:600;
         background:var(--c); color:#fff; margin-top:12px; }
  .btn.ghost { background:#fff; color:var(--c); border:2px solid var(--c); }
  .btn.big { padding:22px; font-size:20px; }
  .btn:disabled { opacity:.5; }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { border:2px solid var(--line); background:#fff; border-radius:10px; padding:12px 14px; font-size:15px; flex:1 1 auto; text-align:center; }
  .chip.on { border-color:var(--c); background:var(--c2); color:var(--c); font-weight:700; }
  .chips.col .chip { flex:1 1 100%; text-align:left; }
  .task { border:2px solid var(--line); border-radius:12px; padding:12px; margin-top:10px; }
  .task.ok { border-color:var(--c); }
  .task .t { font-weight:700; margin-bottom:6px; }
  .meta { font-size:13px; color:#666; line-height:1.6; }
  .tag { display:inline-block; font-size:12px; padding:2px 8px; border-radius:8px; background:#eee; margin-right:4px; }
  .tag.g { background:var(--c2); color:var(--c); }
  .tag.w { background:#fdf2e3; color:var(--warn); }
  .muted { color:#888; font-size:14px; }
  .notes { margin-top:8px; padding:10px; background:#f7f8f6; border-radius:8px; font-size:14px;
           line-height:1.6; white-space:pre-wrap; word-break:break-all; color:#333; }
  .thumbs { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .thumbs div { position:relative; width:84px; height:84px; }
  .thumbs img { width:84px; height:84px; object-fit:cover; border-radius:8px; }
  .thumbs span { position:absolute; top:-6px; right:-6px; background:var(--bad); color:#fff; width:24px; height:24px;
                 border-radius:12px; text-align:center; line-height:24px; font-size:14px; }
  .hidden { display:none !important; }
  #scanBox { position:fixed; inset:0; background:#000; z-index:20; display:flex; flex-direction:column; }
  #scanArea { flex:1; display:flex; flex-direction:column; justify-content:center; overflow:hidden; }
  #reader { width:100%; }
  #reader video { width:100% !important; height:auto !important; display:block; }
  #scanTip { color:#fff; text-align:center; padding:12px; font-size:15px; }
  #scanBox .bar { padding:16px; display:flex; gap:8px; background:#000; }
  #scanBox .bar button { flex:1; }
  #toast { position:fixed; left:16px; right:16px; bottom:24px; background:#222; color:#fff; padding:14px; border-radius:12px;
           text-align:center; z-index:30; }
  #busy { position:fixed; inset:0; background:rgba(255,255,255,.75); z-index:25; display:flex; align-items:center; justify-content:center;
          font-size:17px; font-weight:600; color:var(--c); }
  .done { text-align:center; padding:28px 16px; }
  .done .ic { font-size:56px; }
  a { color:var(--c); }
  #pick { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:22; display:flex; align-items:flex-end; }
  #pick .sheet { background:#fff; width:100%; border-radius:18px 18px 0 0; padding:20px 16px 28px; max-height:90vh; overflow:auto; }
  .qty { display:flex; gap:8px; align-items:center; }
  .qty button { width:64px; height:56px; font-size:28px; border-radius:12px; border:2px solid var(--c); background:#fff; color:var(--c); }
  .qty input { text-align:center; font-size:24px; font-weight:700; }
  .pr { padding:12px; border-bottom:1px solid var(--line); font-size:15px; }
  .pr small { color:#888; }
  .item { display:flex; align-items:center; gap:8px; padding:10px 12px; background:var(--c2); border-radius:10px; margin-top:8px; }
  .item b { flex:1; font-weight:600; font-size:15px; }
  .item span { color:var(--bad); font-size:20px; padding:0 4px; }
</style>
</head>
<body>
<header>
  <b>退貨拆包</b>
  <button id="whoBtn" onclick="show('setup')">設定</button>
</header>

<main>
  <!-- 首次設定 -->
  <section id="v-setup" class="hidden">
    <div class="card">
      <h2>第一次使用設定</h2>
      <label>通關密碼</label>
      <input id="pass" type="password" autocomplete="off">
      <label>你的名字（會記錄在任務留言）</label>
      <input id="who" autocomplete="off" placeholder="例：雅">
      <button class="btn" onclick="login()">開始使用</button>
      <p id="loginErr" style="color:var(--bad);font-weight:600"></p>
    </div>
  </section>

  <!-- 掃描 / 查詢 -->
  <section id="v-home" class="hidden">
    <div class="card">
      <button class="btn big" onclick="startScan()">📷 掃描訂單條碼</button>
      <label>或手動輸入訂單編號</label>
      <div class="row">
        <input id="orderInput" autocomplete="off" autocapitalize="characters" placeholder="例：W343..."
               onkeydown="if(event.key==='Enter')doSearch()">
        <button class="btn" style="margin:0;flex:0 0 90px" onclick="doSearch()">查詢</button>
      </div>
      <button class="btn ghost" onclick="newWithoutOrder()">＋ 沒有訂單編號，直接新增任務</button>
    </div>
    <div id="results"></div>
  </section>

  <!-- 確認既有任務 -->
  <section id="v-confirm" class="hidden">
    <div class="card">
      <h2>倉庫確認</h2>
      <div id="cTask"></div>
      <label>倉儲確認結果</label>
      <div id="cCheck" class="chips col"></div>
      <label>說明 <span id="cNoteHint" class="muted"></span></label>
      <textarea id="cNote" placeholder="包裹異常時請說明狀況"></textarea>
      <label>照片</label>
      <button class="btn ghost" onclick="pickPhoto('c')">📸 拍照 / 選照片</button>
      <div id="cThumbs" class="thumbs"></div>
      <p class="muted">送出後：倉儲確認欄位更新 → 移到「金、物流處理」→ 指派給建立任務的人</p>
      <button class="btn" onclick="submitConfirm()">送出確認</button>
      <button class="btn ghost" onclick="show('home')">返回</button>
    </div>
  </section>

  <!-- 新建任務 -->
  <section id="v-create" class="hidden">
    <div class="card">
      <h2>新建任務（倉儲已拆未查詢到訂單）</h2>
      <label>任務名稱 *</label>
      <input id="nName" placeholder="自行輸入">
      <label>訂單編號</label>
      <input id="nOrder" autocapitalize="characters">
      <label>平台</label>
      <div id="nPlatform" class="chips"></div>
      <label>包裹類型</label>
      <div id="nPkg" class="chips"></div>
      <label>倉儲確認</label>
      <div id="nCheck" class="chips col"></div>
      <label>退款金額（可不填）</label>
      <input id="nRefund" type="number" inputmode="decimal">
      <h2 style="margin-top:22px">描述（會自動排成客服格式）</h2>
      <label>退貨單號</label>
      <input id="dRet" placeholder="官網無可空白">
      <label>物流單號</label>
      <div class="row">
        <input id="dShip" inputmode="numeric">
        <button class="btn ghost" style="margin:0;flex:0 0 76px;padding:10px" onclick="startScan('dShip')">📷 掃</button>
      </div>
      <label>退貨品項</label>
      <div class="row">
        <button class="btn ghost" style="margin:0;padding:12px" onclick="startScan('product')">📷 掃商品條碼</button>
      </div>
      <input id="pSearch" placeholder="或輸入 SKU / 品名關鍵字，例：3082、龍柏" style="margin-top:8px" autocomplete="off"
             onkeydown="if(event.key==='Enter'){const q=this.value.trim();if(q)openPick(q, S.prod[q]||'');}">
      <div id="pResults"></div>
      <div id="itemList"></div>
      <textarea id="dItems" placeholder="掃描或搜尋後自動填入，也可以直接打字" style="min-height:60px;margin-top:8px"></textarea>
      <label>姓名</label>
      <input id="dName">
      <label>電話</label>
      <input id="dTel" type="tel" inputmode="tel">
      <label>特別備註</label>
      <textarea id="nNote" placeholder="例：已拆封使用" style="min-height:60px"></textarea>
      <label>描述預覽</label>
      <div id="dPreview" class="notes"></div>
      <label>照片</label>
      <button class="btn ghost" onclick="pickPhoto('n')">📸 拍照 / 選照片</button>
      <div id="nThumbs" class="thumbs"></div>
      <button class="btn" onclick="submitCreate()">建立任務</button>
      <button class="btn ghost" onclick="show('home')">返回</button>
    </div>
  </section>

  <!-- 完成 -->
  <section id="v-done" class="hidden">
    <div class="card done">
      <div class="ic">✅</div>
      <h2 id="doneMsg"></h2>
      <p id="doneSub" class="muted"></p>
      <p><a id="doneLink" target="_blank">在 Asana 開啟</a></p>
      <button class="btn big" onclick="next()">下一筆</button>
    </div>
  </section>
</main>

<div id="scanBox" class="hidden">
  <div id="scanArea">
    <div id="scanTip">把條碼對準框框中間，會自動讀取</div>
    <div id="reader"></div>
  </div>
  <div class="bar">
    <button class="btn ghost" style="margin:0" onclick="scanByPhoto()">改用拍照辨識</button>
    <button class="btn" style="margin:0;background:#555" onclick="stopScan()">取消</button>
  </div>
</div>
<div id="pick" class="hidden">
  <div class="sheet">
    <div class="muted" id="pkCode"></div>
    <h2 id="pkName" style="margin:6px 0 10px"></h2>
    <div id="pkNew" class="hidden">
      <p class="muted" style="margin:0">對照表裡沒有這個條碼，輸入品名後會記住，下次就認得。</p>
      <input id="pkNewName" placeholder="輸入品名">
    </div>
    <label>寄回數量</label>
    <div class="qty">
      <button onclick="pkQty(-1)">－</button>
      <input id="pkQty" type="number" inputmode="numeric" value="1">
      <button onclick="pkQty(1)">＋</button>
    </div>
    <button class="btn" onclick="pkAdd()">加入退貨品項</button>
    <button class="btn ghost" onclick="pkAdd(true)">加入並繼續掃下一個</button>
    <button class="btn ghost" style="border-color:#bbb;color:#666" onclick="$('pick').classList.add('hidden')">取消</button>
  </div>
</div>
<div id="fileReaderEl" class="hidden"></div>
<input id="photoInput" type="file" accept="image/*" capture="environment" class="hidden">
<input id="barcodePhoto" type="file" accept="image/*" capture="environment" class="hidden">
<div id="busy" class="hidden">處理中…</div>
<div id="toast" class="hidden"></div>

<script>
const S = {
  pass: ls('rp_pass') || '',
  who: ls('rp_who') || '',
  opts: null,
  task: null,
  order: '',
  sel: {},
  photos: { c: [], n: [] }
};
let qr = null;

function ls(k, v) {
  try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; }
}
const $ = id => document.getElementById(id);
function show(v) {
  ['setup','home','confirm','create','done'].forEach(x => $('v-' + x).classList.toggle('hidden', x !== v));
  window.scrollTo(0, 0);
  if (v === 'setup') { $('pass').value = S.pass; $('who').value = S.who; }
}
function toast(msg, ms) {
  const t = $('toast'); t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add('hidden'), ms || 3000);
}
function busy(on, msg) { $('busy').textContent = msg || '處理中…'; $('busy').classList.toggle('hidden', !on); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// Apps Script 網頁應用程式網址（結尾 /exec）
const API_URL = 'https://script.google.com/macros/s/AKfycbzJlfdVFLU22jMVZ95a2JqpKQTD24e3MV3pO5H6oo8h2gz05PbcehuvGbkJWoUYMcxq/exec';

async function call(fn, ...args) {
  // 放在 Apps Script 裡開啟時，直接呼叫
  if (window.google && google.script && google.script.run) {
    return new Promise((res, rej) => {
      google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(e))[fn](S.pass, ...args);
    });
  }
  // 放在 GitHub Pages 時，透過網址呼叫（text/plain 可避免跨網域預檢）
  let r;
  try {
    r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn: fn, pass: S.pass, args: args }) });
  } catch (e) { throw new Error('連不到伺服器，請檢查網路'); }
  const j = await r.json().catch(() => { throw new Error('伺服器回應異常'); });
  if (!j.ok) throw new Error(j.error);
  return j.data;
}

/* ---------- 登入 ---------- */
async function login() {
  const w = $('who').value.trim();
  $('loginErr').textContent = '';
  if (!$('pass').value.trim()) return ($('loginErr').textContent = '請輸入通關密碼');
  if (!w) return ($('loginErr').textContent = '請輸入你的名字');
  S.pass = $('pass').value.trim();
  busy(true, '登入中…');
  try {
    S.opts = await call('init');
    ls('rp_pass', S.pass);
    S.who = w; ls('rp_who', w);
    $('whoBtn').textContent = w + ' ⚙';
    show('home');
    loadProducts(true);
  } catch (e) {
    $('loginErr').textContent = '登入失敗：' + (e.message || e);
  }
  busy(false);
}

async function boot() {
  if (!S.pass || !S.who) return show('setup');
  busy(true, '載入中…');
  try {
    S.opts = await call('init');
    $('whoBtn').textContent = S.who + ' ⚙';
    show('home');
    loadProducts();
  } catch (e) { toast(e.message || e); show('setup'); }
  busy(false);
}

/* ---------- 掃條碼 ---------- */
const FORMATS = () => [
  Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39,
  Html5QrcodeSupportedFormats.CODE_93, Html5QrcodeSupportedFormats.EAN_13,
  Html5QrcodeSupportedFormats.ITF, Html5QrcodeSupportedFormats.QR_CODE,
  Html5QrcodeSupportedFormats.CODABAR
];

let scanTarget = null;   // null = 查詢訂單；否則填入指定欄位
async function startScan(target) {
  scanTarget = typeof target === 'string' ? target : null;
  if (typeof Html5Qrcode === 'undefined') return scanByPhoto();
  $('scanBox').classList.remove('hidden');
  try {
    qr = new Html5Qrcode('reader', { formatsToSupport: FORMATS(), verbose: false });
    await qr.start({ facingMode: 'environment' },
      { fps: 12, qrbox: (w, h) => ({ width: Math.floor(w * 0.85), height: Math.max(80, Math.floor(h * 0.35)) }),
        experimentalFeatures: { useBarCodeDetectorIfSupported: true } },
      text => { stopScan(); gotCode(text); }, () => {});
  } catch (e) {
    // 有些環境不允許網頁直接開相機 → 自動改用拍照辨識
    await stopScan();
    toast('無法直接開啟相機，改用拍照辨識');
    scanByPhoto();
  }
}
async function stopScan() {
  $('scanBox').classList.add('hidden');
  if (qr) { try { await qr.stop(); } catch (e) {} try { qr.clear(); } catch (e) {} qr = null; }
}
async function scanByPhoto() {
  await stopScan();
  $('barcodePhoto').value = '';
  $('barcodePhoto').click();
}
$('barcodePhoto').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  busy(true, '辨識條碼中…');
  try {
    const small = await shrink(f, 1600, 'blob');
    const reader = new Html5Qrcode('fileReaderEl', { formatsToSupport: FORMATS(), verbose: false });
    const text = await reader.scanFile(new File([small], 'b.jpg', { type: 'image/jpeg' }), false);
    busy(false);
    gotCode(text);
  } catch (err) {
    busy(false);
    toast('辨識不到條碼，請靠近一點、對準再拍一次，或手動輸入', 4000);
  }
});
function gotCode(text) {
  if (navigator.vibrate) navigator.vibrate(80);
  if (scanTarget === 'product') { scanTarget = null; openPick(String(text).trim()); return; }
  if (scanTarget) {
    $(scanTarget).value = String(text).trim();
    scanTarget = null;
    updatePreview();
    return;
  }
  $('orderInput').value = String(text).trim();
  doSearch();
}

/* ---------- 查詢 ---------- */
async function doSearch() {
  const q = $('orderInput').value.trim();
  if (q.length < 4) return toast('請輸入訂單編號');
  S.order = q;
  busy(true, '查詢 Asana 中…');
  try {
    const list = await call('search', q);
    renderResults(list);
  } catch (e) { toast(e.message || e); }
  busy(false);
}

function renderResults(list) {
  window._list = list;
  const found = list.filter(t => t.inConfirm);
  const other = list.filter(t => !t.inConfirm);
  let h = '<div class="card">';
  h += `<h2>訂單 ${esc(S.order)}</h2>`;
  if (!list.length) {
    h += '<p>在 Asana 找不到這筆訂單。</p>';
  } else if (!found.length) {
    h += '<p>「倉庫確認」裡沒有待確認的任務，但其他地方有相關任務：</p>';
  } else {
    h += '<p class="muted">點選要確認的任務：</p>';
  }
  found.forEach((t, i) => {
    h += `<div class="task ok" onclick="openConfirm('${t.gid}')">${taskHtml(t)}
          <button class="btn" style="margin-top:10px">確認這筆</button></div>`;
  });
  other.forEach(t => {
    h += `<div class="task">${taskHtml(t)}</div>`;
  });
  h += `<button class="btn ${found.length ? 'ghost' : ''}" onclick="openCreate()">＋ 找不到，新建任務到「倉儲已拆」</button>`;
  h += '</div>';
  $('results').innerHTML = h;
  if (found.length === 1 && other.length === 0) {
    // 只有一筆就直接進確認畫面
    openConfirm(found[0].gid);
  }
}

function taskHtml(t) {
  return `<div class="t">${esc(t.name)}</div>
    <div class="meta">
      <span class="tag ${t.inConfirm ? 'g' : 'w'}">${esc(t.completed ? '已完成' : (t.section || '—'))}</span>
      ${t.check ? `<span class="tag">${esc(t.check)}</span>` : ''}<br>
      平台：${esc(t.platform || '—')}　包裹：${esc(t.pkg || '—')}<br>
      訂單編號：${esc(t.order || '—')}　退款：${esc(t.refund || '—')}<br>
      建立：${esc(t.createdBy || '—')}　負責：${esc(t.assignee || '—')}
    </div>
    ${t.notes ? `<div class="notes">${esc(t.notes)}</div>` : ''}`;
}

/* ---------- 選項按鈕 ---------- */
function chips(elId, key, options) {
  const el = $(elId);
  el.innerHTML = options.map(o => `<div class="chip" data-g="${o.gid}">${esc(o.name)}</div>`).join('');
  el.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    const was = c.classList.contains('on');
    el.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
    if (!was) { c.classList.add('on'); S.sel[key] = { gid: c.dataset.g, name: c.textContent }; }
    else delete S.sel[key];
    if (key === 'cCheck') noteHint();
  });
}
function noteHint() {
  const n = S.sel.cCheck ? S.sel.cCheck.name : '';
  $('cNoteHint').textContent = n.indexOf('有異') >= 0 ? '（必填）' : '';
}

/* ---------- 確認畫面 ---------- */
function openConfirm(gid) {
  S.task = window._list.find(t => t.gid === gid);
  S.sel = {}; S.photos.c = []; renderThumbs('c');
  $('cNote').value = '';
  $('cTask').innerHTML = `<div class="task">${taskHtml(S.task)}</div>`;
  chips('cCheck', 'cCheck', S.opts.check);
  noteHint();
  show('confirm');
}
async function submitConfirm() {
  const chk = S.sel.cCheck;
  if (!chk) return toast('請選擇倉儲確認結果');
  const note = $('cNote').value.trim();
  if (chk.name.indexOf('有異') >= 0 && !note && !S.photos.c.length) return toast('包裹有異請填寫說明或拍照');
  busy(true, '寫入 Asana 中…');
  try {
    const r = await call('confirmTask', {
      gid: S.task.gid, check: chk.gid, checkName: chk.name, note: note, operator: S.who,
      order: S.task.order ? '' : S.order
    });
    await uploadAll(r.gid, 'c');
    done('已確認，移到「金、物流處理」', '已指派給 ' + (r.assignee || '建立者'), r.url);
  } catch (e) { toast(e.message || e, 5000); }
  busy(false);
}

/* ---------- 新建畫面 ---------- */
const DESC_FIELDS = ['dRet', 'dShip', 'dItems', 'dName', 'dTel', 'nNote'];
function buildDesc() {
  const v = id => $(id).value.trim();
  return [
    '退貨單號(官網無)：' + v('dRet'),
    '物流單號：' + v('dShip'),
    '退貨品項：' + v('dItems'),
    '姓名：' + v('dName'),
    '電話：' + v('dTel'),
    '特別備註：' + v('nNote')
  ].join('\n');
}
function updatePreview() { $('dPreview').textContent = buildDesc(); }
DESC_FIELDS.forEach(id => $(id).addEventListener('input', updatePreview));

function newWithoutOrder() {
  S.order = '';
  $('results').innerHTML = '';
  openCreate();
}

function openCreate() {
  S.sel = {}; S.photos.n = []; renderThumbs('n');
  ['nName','nRefund'].concat(DESC_FIELDS).forEach(id => $(id).value = '');
  // 掃到的若不像官網/蝦皮訂單編號（純數字），預設當作物流單號
  S.items = []; renderItems(); $('pSearch').value = ''; $('pResults').innerHTML = '';
  const isShip = /^\d{8,15}$/.test(S.order || '');
  $('dShip').value = isShip ? S.order : '';
  $('nOrder').value = isShip ? '' : (S.order || '');
  updatePreview();
  chips('nPlatform', 'nPlatform', S.opts.platform);
  chips('nPkg', 'nPkg', S.opts.pkg);
  chips('nCheck', 'nCheck', S.opts.check);
  show('create');
}
async function submitCreate() {
  const name = $('nName').value.trim();
  if (!name) return toast('請輸入任務名稱');
  busy(true, '建立任務中…');
  try {
    const r = await call('createTask', {
      name: name,
      order: $('nOrder').value.trim(),
      platform: S.sel.nPlatform ? S.sel.nPlatform.gid : '',
      pkg: S.sel.nPkg ? S.sel.nPkg.gid : '',
      check: S.sel.nCheck ? S.sel.nCheck.gid : '',
      refund: $('nRefund').value.trim(),
      note: buildDesc(),
      operator: S.who
    });
    await uploadAll(r.gid, 'n');
    done('已建立到「倉儲已拆未查詢到訂單」', name, r.url);
  } catch (e) { toast(e.message || e, 5000); }
  busy(false);
}

/* ---------- 照片 ---------- */
let photoTarget = 'c';
function pickPhoto(which) { photoTarget = which; $('photoInput').value = ''; $('photoInput').click(); }
$('photoInput').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  busy(true, '壓縮照片中…');
  try {
    const b64 = await shrink(f, 1600, 'base64');
    S.photos[photoTarget].push(b64);
    renderThumbs(photoTarget);
  } catch (err) { toast('照片讀取失敗'); }
  busy(false);
});
function renderThumbs(which) {
  $(which + 'Thumbs').innerHTML = S.photos[which].map((b, i) =>
    `<div><img src="data:image/jpeg;base64,${b}"><span onclick="S.photos['${which}'].splice(${i},1);renderThumbs('${which}')">✕</span></div>`).join('');
}
async function uploadAll(gid, which) {
  const list = S.photos[which];
  const d = new Date(), p = n => String(n).padStart(2, '0');
  const stamp = d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes());
  for (let i = 0; i < list.length; i++) {
    busy(true, `上傳照片 ${i + 1}/${list.length}…`);
    await call('uploadPhoto', gid, `return_${stamp}_${i + 1}.jpg`, list[i]);
  }
}
function shrink(file, max, out) {
  return new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight;
      const s = Math.min(1, max / Math.max(w, h));
      w = Math.round(w * s); h = Math.round(h * s);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      if (out === 'blob') cv.toBlob(b => res(b), 'image/jpeg', 0.9);
      else res(cv.toDataURL('image/jpeg', 0.8).split(',')[1]);
    };
    img.onerror = rej;
    img.src = url;
  });
}

/* ---------- 商品條碼對照 ---------- */
S.prod = {};      // { code: name }
S.prodList = [];  // [[code, name]]
S.items = [];     // [{ name, qty }]

function setProducts(rows) {
  S.prodList = rows;
  S.prod = {};
  rows.forEach(r => { S.prod[r[0]] = r[1]; });
}
async function loadProducts(force) {
  try {
    const c = JSON.parse(ls('rp_prod') || 'null');
    if (c && c.rows) setProducts(c.rows);
    if (!force && c && Date.now() - c.at < 6 * 3600e3) return;
  } catch (e) {}
  try {
    const r = await call('getProducts');
    setProducts(r.rows);
    ls('rp_prod', JSON.stringify({ at: Date.now(), rows: r.rows }));
  } catch (e) { /* 對照表載入失敗時仍可手打 */ }
}

let pkCode = '', pkKnown = false;
function openPick(code, name) {
  pkCode = code;
  const n = name || (S.prod && S.prod[code]) || '';
  pkKnown = !!n;
  $('pkCode').textContent = code ? '條碼：' + code : '';
  $('pkName').textContent = n || '找不到這個條碼';
  $('pkNew').classList.toggle('hidden', pkKnown);
  $('pkNewName').value = '';
  $('pkQty').value = 1;
  $('pick').classList.remove('hidden');
}
function pkQty(d) { $('pkQty').value = Math.max(1, (parseInt($('pkQty').value, 10) || 1) + d); }
async function pkAdd(again) {
  let name = pkKnown ? $('pkName').textContent : $('pkNewName').value.trim();
  if (!name) return toast('請輸入品名');
  const qty = Math.max(1, parseInt($('pkQty').value, 10) || 1);
  if (!pkKnown && pkCode) {
    S.prod[pkCode] = name; S.prodList.push([pkCode, name]);
    call('addProduct', pkCode, name).then(() => loadProducts(true)).catch(() => {});
  }
  const ex = S.items.find(i => i.name === name);
  if (ex) ex.qty += qty; else S.items.push({ name: name, qty: qty });
  renderItems();
  $('pick').classList.add('hidden');
  if (again) startScan('product');
}
function renderItems() {
  $('itemList').innerHTML = S.items.map((it, i) =>
    `<div class="item"><b>${esc(it.name)}</b> ×${it.qty}<span onclick="S.items.splice(${i},1);renderItems()">✕</span></div>`).join('');
  if (S.items.length) $('dItems').value = S.items.map(i => i.name + i.qty).join('+');
  updatePreview();
}
$('pSearch').addEventListener('input', () => {
  const q = $('pSearch').value.trim().toLowerCase();
  if (q.length < 1 || !S.prodList.length) { $('pResults').innerHTML = q && !S.prodList.length ? '<p class="muted">商品對照表載入中…</p>' : ''; return; }
  const words = q.split(/\s+/);
  const exact = S.prodList.filter(r => r[0].toLowerCase() === q);
  const prefix = S.prodList.filter(r => r[0].toLowerCase() !== q && r[0].toLowerCase().startsWith(q));
  const byName = S.prodList.filter(r => !r[0].toLowerCase().startsWith(q) &&
    words.every(w => (r[1] + ' ' + r[0]).toLowerCase().includes(w)));
  const hits = exact.concat(prefix, byName).slice(0, 30);
  window._hits = hits;
  $('pResults').innerHTML = hits.length
    ? hits.map((r, i) => `<div class="pr" onclick="openPick(_hits[${i}][0], _hits[${i}][1])">${esc(r[1])}<br><small>${esc(r[0])}</small></div>`).join('')
    : '<p class="muted">找不到符合的商品</p>';
});

/* ---------- 完成 ---------- */
function done(msg, sub, url) {
  $('doneMsg').textContent = msg;
  $('doneSub').textContent = sub || '';
  $('doneLink').href = url;
  show('done');
}
function next() {
  $('orderInput').value = ''; $('results').innerHTML = ''; S.order = '';
  show('home');
}

boot();
</script>
